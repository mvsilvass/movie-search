app:
  movie-csv-path: src/main/resources/database_filmes/tmdb_5000_movies.csv

spring:
  application:
    name: movie-search

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/movie_search
    username: postgres
    password: postgres

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          order_inserts: true
        generate_statistics: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  ai:
    vectorstore:
      pgvector:
        batching-strategy: BATCH_PER_DOCUMENT
        distance-type: COSINE_DISTANCE
        initialize-schema: true
        index-type: HNSW
        dimensions: 768

    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text