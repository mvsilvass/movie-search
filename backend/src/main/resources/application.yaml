server:
  port: ${SERVER_PORT}

spring:
  application:
    name: movie-search
  config:
    import: "optional:file:../.env[.properties]"

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          order_inserts: true
        generate_statistics: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  ai:
    vectorstore:
      pgvector:
        batching-strategy: BATCH_PER_DOCUMENT
        distance-type: COSINE_DISTANCE
        initialize-schema : true
        index-type: HNSW
        dimensions: 768

    ollama:
      base-url: ${OLLAMA_BASE_URL}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL}

app:
  movie-csv-path: ${MOVIE_CSV_PATH}
  cors:
    allowed-origins: ${FRONTEND_URL}

tmdb:
  api:
    key: ${TMDB_API_KEY}
    url: ${TMDB_API_URL}
  image:
    base-url: ${TMDB_IMAGE_BASE_URL}
    poster-size: ${TMDB_IMAGE_POSTER_SIZE}