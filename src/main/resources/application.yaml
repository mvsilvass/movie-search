app:
  movie-csv-path: src/main/resources/database_filmes/tmdb_5000_movies.csv

spring:
  application:
    name: movie-search

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/movie_search
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update